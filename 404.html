<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <title>Page not found — Yoga Hanggara</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #111111;
      --muted: #5a5a5a;
      --accent: #2457ff;
      --sans: Arial, sans-serif;
    }

    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      margin: 0;
      padding: 24px;
      background: #ffffff;
      color: var(--ink);
      font-family: var(--sans);
      text-align: center;
    }
    main { max-width: 480px; }
    p { color: var(--muted); }
    a {
      color: var(--accent);
      font-weight: 700;
    }
    a:focus-visible {
      outline: 3px solid rgba(36, 87, 255, 0.38);
      outline-offset: 3px;
    }
  </style>
</head>
<body>
  <main>
    <p>404</p>
    <h1>Page not found</h1>
    <p>The page you’re looking for doesn’t exist.</p>
    <a href="/">Back to the homepage</a>
  </main>
</body>
</html>
